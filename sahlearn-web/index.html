    <meta name="google-adsense-account" content="ca-pub-1503199816496831" />
    <!-- Google AdSense. Both tags are static, in the <head>, not injected: the
         AdSense reviewer must find them in the served HTML. The publisher ID is a
         public value — /ads.txt and every ad request carry it. -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1503199816496831"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Google Analytics (GA4). The measurement ID is public, like the AdSense
         one, so it is committed rather than left to a deploy-time env var.
         Skipped on localhost so development traffic never reaches the property;
         window.gtag then stays undefined and usePageTracking no-ops. -->
    <script>
      (function () {
        var id = 'G-86BFQ6G0VR';
        var host = location.hostname;
        if (host === 'localhost' || host === '127.0.0.1' || host === '[::1]') return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', id);
      })();
    </script>
  </body>
</html>
